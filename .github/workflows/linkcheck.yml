name: Link Check
on: [push, pull_request]

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13
        architecture: x64
    - run: pip install -r requirements.txt
    - run: cd ./docs/ && make dirhtml
    - run: cd ./docs/ && make linkcheck

