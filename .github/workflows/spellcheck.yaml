name: GitHub Spellcheck Action
on: [push, pull_request]

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
    # The checkout step
    - uses: actions/checkout@v4
    - uses: rojopolis/spellcheck-github-actions@0.49.0
      name: Spellcheck
      with: 
        source_files: docs/components/conversion_tools.md
        task_name: Markdown
